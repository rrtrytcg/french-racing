<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#5fb4ff" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23071322'/%3E%3Cpath d='M16 7 L24 25 H20.5 L16 14.5 L11.5 25 H8 Z' fill='%23f05a47'/%3E%3C/svg%3E" />
    <title>APEX · French racing lab</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app" class="app-shell">
      <header class="topbar">
        <button class="brand" type="button" data-action="home" aria-label="Return to setup">
          <span class="brand-mark" aria-hidden="true">A</span>
          <span><small>French racing lab</small><strong>APEX</strong></span>
        </button>
        <div class="topbar-meta" aria-label="Race controls">
          <span id="race-meta" class="race-meta">Ready for lights out</span>
          <button id="sound-toggle" class="icon-button" type="button" data-action="sound" aria-pressed="false" title="Sound is muted">◌<span class="sr-only">Toggle sound</span></button>
          <button class="outline-button" type="button" data-action="rules">Rules</button>
        </div>
      </header>

      <main id="main" tabindex="-1"></main>

      <footer class="statusbar">
        <span><i class="status-dot"></i> Local prototype</span>
        <span>Classroom multiplayer ready · v0.2</span>
      </footer>
    </div>
    <script type="module" src="./app.mjs"></script>
  </body>
</html>
